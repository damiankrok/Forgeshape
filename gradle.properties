org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
# Required by the androidTest instrumentation artifacts, which are the only
# AndroidX in the project. The product APK still contains no AndroidX: this
# flag governs how AndroidX-namespaced artifacts are resolved, not whether any
# are added, and nothing in app/src/main depends on one.
android.useAndroidX=true
android.nonTransitiveRClass=true
