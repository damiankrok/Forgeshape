<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="Inter, Roboto, 'Segoe UI', sans-serif">
  <title>ForgeShape WF-4 — tablet landscape (1280 x 800 dp), Sculpt with docked hierarchy and inspector</title>
  <desc>Original ForgeShape wireframe. Not production UI. Same shell vocabulary as phone: identical global strip, identical right tool rail, identical edge Radius/Strength. Extra width is spent docking the hierarchy and the inspector rather than enlarging controls.</desc>

  <defs>
    <linearGradient id="vp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10151C"/><stop offset="1" stop-color="#080B10"/>
    </linearGradient>
    <radialGradient id="clay" cx="0.38" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#8FA6C4"/><stop offset="0.55" stop-color="#54677F"/><stop offset="1" stop-color="#2B3646"/>
    </radialGradient>
    <linearGradient id="track" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#4C8FD8"/><stop offset="1" stop-color="#7FB5EE"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="800" fill="url(#vp)"/>

  <!-- ============ viewport content ============ -->
  <ellipse cx="596" cy="430" rx="196" ry="188" fill="url(#clay)"/>
  <path d="M672 358 q50 40 30 92 q-44 -22 -64 -46 z" fill="#A9BDD6" opacity="0.5"/>
  <ellipse cx="596" cy="646" rx="140" ry="18" fill="#000" opacity="0.32"/>
  <circle cx="660" cy="392" r="72" fill="none" stroke="#EAF2FC" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.9"/>
  <circle cx="660" cy="392" r="2.5" fill="#EAF2FC" opacity="0.9"/>

  <!-- ============ global strip — identical to phone ============ -->
  <rect x="0" y="0" width="1280" height="48" fill="#12171F"/>
  <line x1="0" y1="48" x2="1280" y2="48" stroke="#2A3441"/>
  <rect x="14" y="12" width="24" height="24" rx="7" fill="#1C2430" stroke="#2A3441"/>
  <path d="M27 18 l-6 6 l6 6" fill="none" stroke="#8B99AC" stroke-width="1.8" stroke-linecap="round"/>
  <text x="48" y="29" fill="#8B99AC" font-size="12">Untitled</text>

  <rect x="580" y="11" width="120" height="26" rx="13" fill="#1B2735" stroke="#4C8FD8"/>
  <circle cx="595" cy="24" r="3.5" fill="#4C8FD8"/>
  <text x="605" y="28" fill="#E8EDF4" font-size="12" font-weight="600">Sculpt</text>
  <path d="M685 21 l4 5 l4 -5" fill="none" stroke="#8B99AC" stroke-width="1.6" stroke-linecap="round"/>

  <path d="M1140 19 a8 8 0 1 0 3 12" fill="none" stroke="#8B99AC" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M1140 19 l-4 -3 l0 6 z" fill="#8B99AC"/>
  <path d="M1176 19 a8 8 0 1 1 -3 12" fill="none" stroke="#48525F" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M1176 19 l4 -3 l0 6 z" fill="#48525F"/>
  <circle cx="1216" cy="24" r="1.6" fill="#8B99AC"/><circle cx="1223" cy="24" r="1.6" fill="#8B99AC"/><circle cx="1230" cy="24" r="1.6" fill="#8B99AC"/>
  <rect x="1244" y="12" width="22" height="24" rx="6" fill="#1C2430" stroke="#2A3441"/><rect x="1248" y="16" width="14" height="16" rx="3" fill="none" stroke="#8B99AC" stroke-width="1.4"/><line x1="1254" y1="16" x2="1254" y2="32" stroke="#8B99AC" stroke-width="1.4"/>

  <!-- ============ LEFT DOCK — hierarchy (pinned) ============ -->
  <rect x="0" y="48" width="224" height="752" fill="#131922"/>
  <line x1="224" y1="48" x2="224" y2="800" stroke="#2A3441"/>
  <text x="16" y="76" fill="#6E8CAE" font-size="11" letter-spacing="0.7">HIERARCHY</text>
  <rect x="180" y="62" width="30" height="20" rx="6" fill="#20456E" stroke="#4C8FD8"/>
  <path d="M191 67 l0 10 M188 72 l3 -5 l3 5" fill="none" stroke="#EAF2FC" stroke-width="1.4" stroke-linecap="round"/>

  <!-- the one object, with its TWO representations — not two objects -->
  <rect x="10" y="92" width="204" height="34" rx="9" fill="#20456E" stroke="#4C8FD8"/>
  <polygon points="26,105 34,101 42,105 34,109" fill="none" stroke="#EAF2FC" stroke-width="1.4" stroke-linejoin="round"/>
  <text x="52" y="114" fill="#EAF2FC" font-size="11.5" font-weight="600">Object 1</text>
  <circle cx="200" cy="109" r="6" fill="none" stroke="#EAF2FC" stroke-width="1.3"/>

  <rect x="24" y="132" width="190" height="30" rx="8" fill="#1A212B"/>
  <text x="44" y="151" fill="#9FB0C6" font-size="10.5">Construction Source</text>
  <text x="196" y="151" fill="#5A6878" font-size="9" text-anchor="end">sphere</text>
  <rect x="24" y="166" width="190" height="30" rx="8" fill="#1E2A38" stroke="#3A5570"/>
  <text x="44" y="185" fill="#E8EDF4" font-size="10.5">Frozen Sculpt Mesh</text>
  <text x="196" y="185" fill="#7BD88F" font-size="9" text-anchor="end">482 v</text>

  <line x1="10" y1="216" x2="214" y2="216" stroke="#232C38"/>
  <text x="16" y="242" fill="#6E8CAE" font-size="11" letter-spacing="0.7">HISTORY</text>
  <text x="196" y="242" fill="#4A545F" font-size="9" text-anchor="end">reserved</text>
  <g fill="#3E4854" font-size="10">
    <text x="24" y="268">Sphere ⌀ 2 m</text>
    <text x="24" y="292">Freeze to Sculpt</text>
    <text x="24" y="316">Grab × 1</text>
  </g>

  <!-- ============ left edge of the VIEWPORT — same sliders as phone ============ -->
  <rect x="238" y="96" width="64" height="430" rx="20" fill="#121820" opacity="0.72"/>
  <rect x="243" y="104" width="24" height="18" rx="6" fill="#1C2430"/>
  <text x="255" y="117" fill="#E8EDF4" font-size="9" text-anchor="middle" font-weight="600">120</text>
  <rect x="273" y="104" width="24" height="18" rx="6" fill="#1C2430"/>
  <text x="285" y="117" fill="#E8EDF4" font-size="9" text-anchor="middle" font-weight="600">.60</text>
  <rect x="252" y="132" width="6" height="352" rx="3" fill="#26303C"/>
  <rect x="252" y="272" width="6" height="212" rx="3" fill="url(#track)"/>
  <circle cx="255" cy="272" r="11" fill="#EAF2FC"/><circle cx="255" cy="272" r="4" fill="#4C8FD8"/>
  <text x="255" y="506" fill="#8B99AC" font-size="9" text-anchor="middle" letter-spacing="0.6">RAD</text>
  <rect x="282" y="132" width="6" height="352" rx="3" fill="#26303C"/>
  <rect x="282" y="344" width="6" height="140" rx="3" fill="url(#track)"/>
  <circle cx="285" cy="344" r="11" fill="#EAF2FC"/><circle cx="285" cy="344" r="4" fill="#4C8FD8"/>
  <text x="285" y="506" fill="#8B99AC" font-size="9" text-anchor="middle" letter-spacing="0.6">STR</text>

  <!-- ============ RIGHT DOCK — inspector, tabbed ============ -->
  <rect x="936" y="48" width="276" height="752" fill="#131922"/>
  <line x1="936" y1="48" x2="936" y2="800" stroke="#2A3441"/>

  <rect x="948" y="62" width="252" height="30" rx="9" fill="#1B222C"/>
  <rect x="950" y="64" width="124" height="26" rx="8" fill="#20456E" stroke="#4C8FD8"/>
  <text x="1012" y="82" fill="#EAF2FC" font-size="11" text-anchor="middle" font-weight="600">Brush</text>
  <text x="1136" y="82" fill="#7C8899" font-size="11" text-anchor="middle">Object</text>

  <text x="948" y="122" fill="#6E8CAE" font-size="10.5" letter-spacing="0.6">ACTIVE TOOL</text>
  <rect x="948" y="132" width="252" height="44" rx="11" fill="#20456E" stroke="#4C8FD8"/>
  <circle cx="974" cy="154" r="9" fill="none" stroke="#EAF2FC" stroke-width="1.7"/>
  <path d="M974 145 l0 -5 M974 163 l0 5 M965 154 l-5 0 M983 154 l5 0" stroke="#EAF2FC" stroke-width="1.7" stroke-linecap="round"/>
  <text x="996" y="152" fill="#EAF2FC" font-size="12" font-weight="600">Grab</text>
  <text x="996" y="166" fill="#A9BDD6" font-size="9.5">drag the surface with your finger</text>

  <text x="948" y="208" fill="#6E8CAE" font-size="10.5" letter-spacing="0.6">RADIUS</text>
  <text x="1200" y="208" fill="#E8EDF4" font-size="10.5" text-anchor="end" font-family="ui-monospace, monospace">120 px</text>
  <rect x="948" y="216" width="252" height="6" rx="3" fill="#26303C"/>
  <rect x="948" y="216" width="88" height="6" rx="3" fill="#4C8FD8"/>
  <circle cx="1036" cy="219" r="10" fill="#EAF2FC"/><circle cx="1036" cy="219" r="4" fill="#4C8FD8"/>

  <text x="948" y="262" fill="#6E8CAE" font-size="10.5" letter-spacing="0.6">STRENGTH</text>
  <text x="1200" y="262" fill="#E8EDF4" font-size="10.5" text-anchor="end" font-family="ui-monospace, monospace">0.60</text>
  <rect x="948" y="270" width="252" height="6" rx="3" fill="#26303C"/>
  <rect x="948" y="270" width="148" height="6" rx="3" fill="#4C8FD8"/>
  <circle cx="1096" cy="273" r="10" fill="#EAF2FC"/><circle cx="1096" cy="273" r="4" fill="#4C8FD8"/>

  <line x1="948" y1="312" x2="1200" y2="312" stroke="#232C38"/>

  <!-- validation / stale-source lives in the inspector, never off-screen -->
  <rect x="948" y="330" width="252" height="70" rx="11" fill="#241F14" stroke="#E7C26B"/>
  <path d="M968 348 l9 16 l-18 0 z" fill="none" stroke="#E7C26B" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="968" y="362" fill="#E7C26B" font-size="10" text-anchor="middle" font-weight="700">!</text>
  <text x="990" y="352" fill="#E7C26B" font-size="10.5" font-weight="600">Construction shape changed</text>
  <text x="990" y="367" fill="#C9AE72" font-size="9.5">Your sculpt is kept as it is.</text>
  <rect x="990" y="374" width="106" height="20" rx="6" fill="#2A2416" stroke="#E7C26B"/>
  <text x="1043" y="388" fill="#E7C26B" font-size="9.5" text-anchor="middle">Freeze again…</text>

  <rect x="948" y="748" width="252" height="36" rx="10" fill="#1C2430" stroke="#3A4552"/>
  <text x="1074" y="771" fill="#9FB0C6" font-size="11" text-anchor="middle">Back to Construction</text>

  <!-- ============ RIGHT RAIL — identical to phone ============ -->
  <rect x="1212" y="48" width="68" height="752" fill="#0F141B"/>
  <line x1="1212" y1="48" x2="1212" y2="800" stroke="#2A3441"/>

  <rect x="1220" y="64" width="52" height="72" rx="14" fill="#20456E" stroke="#4C8FD8" stroke-width="1.5"/>
  <circle cx="1246" cy="90" r="10" fill="none" stroke="#EAF2FC" stroke-width="1.8"/>
  <path d="M1246 80 l0 -6 M1246 100 l0 6 M1236 90 l-6 0 M1256 90 l6 0" stroke="#EAF2FC" stroke-width="1.8" stroke-linecap="round"/>
  <text x="1246" y="125" fill="#EAF2FC" font-size="10" text-anchor="middle" font-weight="600">Grab</text>

  <rect x="1220" y="142" width="52" height="72" rx="14" fill="#182029"/>
  <path d="M1232 178 q14 -18 28 0" fill="none" stroke="#9FB0C6" stroke-width="1.8" stroke-linecap="round"/><path d="M1246 152 l0 12 M1242 160 l4 5 l4 -5" fill="none" stroke="#9FB0C6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1246" y="203" fill="#9FB0C6" font-size="10" text-anchor="middle">Clay</text>

  <rect x="1220" y="220" width="52" height="72" rx="14" fill="#182029"/>
  <path d="M1232 254 q7 -12 14 0 q7 12 14 0" fill="none" stroke="#9FB0C6" stroke-width="1.8" stroke-linecap="round"/>
  <text x="1246" y="281" fill="#9FB0C6" font-size="10" text-anchor="middle">Smooth</text>

  <rect x="1220" y="298" width="52" height="72" rx="14" fill="#182029"/>
  <circle cx="1246" cy="324" r="8" fill="none" stroke="#9FB0C6" stroke-width="1.8"/>
  <path d="M1246 310 l0 -5 M1246 338 l0 5 M1232 324 l-5 0 M1260 324 l5 0" stroke="#9FB0C6" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
  <text x="1246" y="359" fill="#9FB0C6" font-size="10" text-anchor="middle">Inflate</text>

  <rect x="1226" y="386" width="40" height="40" rx="14" fill="#151B23" stroke="#2A3441"/>
  <path d="M1239 398 l7 8 l-7 8 M1250 398 l7 8 l-7 8" fill="none" stroke="#8B99AC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- measurement annotation -->
  <g stroke="#4C8FD8" stroke-width="1" opacity="0.5">
    <path d="M224 780 H936"/><path d="M224 774 V786"/><path d="M936 774 V786"/>
  </g>
  <rect x="518" y="768" width="124" height="22" rx="7" fill="#0E141C" stroke="#4C8FD8" opacity="0.9"/>
  <text x="580" y="783" fill="#7FB5EE" font-size="10" text-anchor="middle">viewport 712 dp wide</text>
</svg>
