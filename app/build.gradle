plugins {
    id 'com.android.application'
}

android {
    namespace 'com.forgeshape.app'
    compileSdk 36
    buildToolsVersion '36.1.0'
    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId 'com.forgeshape.app'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.3.0'

        // Stage 003 targets only the available runtime target (x86_64 emulator).
        ndk {
            abiFilters 'x86_64'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
                cppFlags '-std=c++17'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
        }
    }
}

// No runtime dependencies: no AndroidX, no engine, no third-party renderer/math library.
